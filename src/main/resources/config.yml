# Configuración de AntiAFK

# Minutos de inactividad para marcar a un jugador como AFK.
afk-time: 5

# Minutos de inactividad antes de expulsar al jugador.
kick-time: 10

# Minutos de anticipación del aviso antes de la expulsión.
warning-time: 2

# Anunciar cuando un jugador entra o sale del estado AFK.
broadcast-afk: true

# Mensajes predeterminados (puedes personalizarlos y usar colores con &).
messages:
  prefix: "&7[&cAntiAFK&7] "
  afk: "{prefix}&e{player} &7ahora está AFK."
  no-longer-afk: "{prefix}&e{player} &7ya no está AFK."
  warning: "{prefix}&c¡Atención! &7Serás expulsado por inactividad en &e{time} &7minutos."
  kick-reason: "Has sido expulsado por permanecer inactivo demasiado tiempo."

# Mundos en los que no se aplicará la detección AFK.
# Usa los nombres exactos. Lista vacía = detección en todos los mundos.
disabled-worlds: []

# Jugadores excluidos. También se admite el permiso antiafk.bypass.
exempt-players:
  - "admin"
  - "moderator"
